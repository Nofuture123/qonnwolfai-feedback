name: 问题反馈
description: 报告穹狼AI客户端的问题(描述越具体,修复越快)
labels: []
body:
  - type: markdown
    attributes:
      value: |
        提交后系统会自动把这条反馈转入开发仓并回复链接,修复进展以回复里的链接为准。
  - type: dropdown
    id: product
    attributes:
      label: 哪个产品
      options:
        - 学生端(穹狼AI学生版)
        - 员工版(穹狼AI教师/员工版)
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: 出问题的位置
      description: 哪个页面/功能
      placeholder: 例:游戏工坊 → 道具车间 → 保存按钮
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步一步写清怎么操作能让问题出现
      placeholder: |
        1. 登录后打开作品 X
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 本来应该发生什么
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 实际发生了什么(报错文案原样贴上)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图 / 日志
      description: 截图直接拖进来
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 客户端版本 + 系统
      placeholder: 例:v0.1.4 / Windows 11
    validations:
      required: false
